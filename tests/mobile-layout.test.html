<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>모바일 게임 레이아웃 브라우저 테스트</title>
  <style>
    body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#f5f5ff;color:#20213e}
    #viewport{display:block;border:0;box-shadow:0 0 0 1px #c8c9e8}
    .pass{color:#197442}.fail{color:#b3263e}pre{white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>모바일 게임 레이아웃 브라우저 테스트</h1>
  <p id="size"></p>
  <ol id="results"></ol>
  <pre id="metrics" aria-live="polite"></pre>
  <iframe id="viewport" title="모바일 게임 테스트 화면"></iframe>

  <script>
    const params = new URLSearchParams(location.search);
    const width = Number(params.get("width") || 320);
    const height = Number(params.get("height") || 568);
    const landscape = params.get("landscape") === "true";
    const frame = document.querySelector("#viewport");
    const results = document.querySelector("#results");
    const metrics = document.querySelector("#metrics");
    document.querySelector("#size").textContent = `검증 뷰포트: ${width} × ${height}${landscape ? " (가로)" : ""}`;
    frame.width = String(width);
    frame.height = String(height);
    frame.style.width = `${width}px`;
    frame.style.height = `${height}px`;
    frame.src = `../%EC%BD%A9%EC%A5%90%EC%95%BC_%EC%A4%98%EB%95%8C%EC%8D%A8.html?training=atomic_number&layoutTest=${width}x${height}`;

    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const run = (name, callback) => {
      const item = document.createElement("li");
      try {
        callback();
        item.className = "pass";
        item.textContent = `PASS — ${name}`;
      } catch (error) {
        item.className = "fail";
        item.textContent = `FAIL — ${name}: ${error.message}`;
      }
      results.append(item);
    };
    const visible = element => {
      const style = element && element.ownerDocument.defaultView.getComputedStyle(element);
      const rect = element && element.getBoundingClientRect();
      return Boolean(element && style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0);
    };
    const report = () => {
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      const root = doc.documentElement;
      const body = doc.body;
      const dock = doc.querySelector("#ui-mobileInputDock");
      const keypad = doc.querySelector("#ui-mobileKeypad");
      const toolbar = doc.querySelector(".game-bottom-toolbar");
      const stage = doc.querySelector("#visualStage");
      const jar = doc.querySelector(".jar");
      const toad = doc.querySelector(".toad");
      const question = doc.querySelector("#questionText");
      const dockRect = dock?.getBoundingClientRect();
      const toolbarRect = toolbar?.getBoundingClientRect();
      const stageRect = stage?.getBoundingClientRect();
      const jarRect = jar?.getBoundingClientRect();
      const toadRect = toad?.getBoundingClientRect();
      const values = {
        deviceLayout: root.dataset.deviceLayout,
        viewport: `${win.innerWidth}×${win.innerHeight}`,
        scroll: `${Math.max(root.scrollWidth, body.scrollWidth)}×${Math.max(root.scrollHeight, body.scrollHeight)}`,
        dockBottom: Math.round(dockRect?.bottom || 0),
        toolbarTop: Math.round(toolbarRect?.top || 0),
        stageHeight: Math.round(stageRect?.height || 0),
        jarHeight: Math.round(jarRect?.height || 0),
        toad: `${Math.round(toadRect?.width || 0)}×${Math.round(toadRect?.height || 0)}`
      };
      run("모바일 모드와 단일 키패드", () => {
        assert(root.dataset.deviceLayout === "mobile", `device layout=${root.dataset.deviceLayout}`);
        assert(doc.querySelectorAll("#ui-mobileKeypad").length === 1, "키패드 DOM이 하나가 아닙니다.");
        assert(visible(keypad) && visible(dock), "모바일 키패드가 표시되지 않습니다.");
      });
      run("가로·세로 스크롤 없음", () => {
        assert(Math.max(root.scrollWidth, body.scrollWidth) <= win.innerWidth + 1, "가로 스크롤이 생겼습니다.");
        assert(Math.max(root.scrollHeight, body.scrollHeight) <= win.innerHeight + 1, "세로 스크롤이 생겼습니다.");
      });
      run("문제·장독대·두꺼비가 보임", () => {
        assert(visible(question), "문제 발문이 표시되지 않습니다.");
        assert(visible(stage) && visible(jar), "장독대 장면이 표시되지 않습니다.");
        assert(visible(toad) && toadRect.height >= 16, "두꺼비가 식별 가능한 크기가 아닙니다.");
        assert(jarRect.height >= stageRect.height * 0.65, "장독대가 장면 대비 너무 작습니다.");
      });
      run("입력 도크와 하단 툴바가 겹치지 않음", () => {
        assert(visible(toolbar), "하단 툴바가 표시되지 않습니다.");
        assert(dockRect.bottom <= toolbarRect.top + 1, `입력 도크(${dockRect.bottom})와 툴바(${toolbarRect.top})가 겹칩니다.`);
        assert(toolbar.querySelectorAll("button").length === 4, "하단 툴바 버튼 수가 맞지 않습니다.");
      });
      run("게임 내 키패드 입력과 일시정지 툴바가 동작함", () => {
        const input = doc.querySelector("#answerInput");
        const digit = keypad.querySelector('[aria-label="숫자 1"]');
        const pause = doc.querySelector("#ui-toolbarPause");
        assert(digit && pause, "게임 키패드 또는 일시정지 버튼이 없습니다.");
        digit.click();
        assert(input.value.length > 0, "게임 키패드 입력이 기본 input에 연결되지 않았습니다.");
        pause.click();
        assert(pause.getAttribute("aria-pressed") === "true" && pause.textContent.includes("계속하기"), "일시정지 툴바가 계속하기로 바뀌지 않았습니다.");
        pause.click();
        assert(pause.getAttribute("aria-pressed") === "false" && pause.textContent.includes("일시정지"), "계속하기 툴바가 일시정지로 바뀌지 않았습니다.");
      });      metrics.textContent = JSON.stringify(values, null, 2);
      window.__terraMobileLayoutResults = { passed: results.querySelectorAll(".pass").length, failed: results.querySelectorAll(".fail").length, values };
    };
    frame.addEventListener("load", () => window.setTimeout(report, 1500), { once: true });
  </script>
</body>
</html>
