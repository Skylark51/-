name: Temporary Water Splash Asset Job

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-water-splash-asset.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3072x512 RGBA water splash sheet
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          import math, random
          W,H,CELL = 3072,512,512
          out = Image.new('RGBA',(W,H),(0,0,0,0))
          random.seed(23)
          def layer(): return Image.new('RGBA',(CELL,CELL),(0,0,0,0))
          def ripple(im, y, rx, ry, alpha=125, width=5):
              d=ImageDraw.Draw(im); box=(256-rx,y-ry,256+rx,y+ry)
              d.ellipse(box, outline=(105,210,246,alpha), width=width)
              if rx>24:
                  box2=(256-rx+9,y-ry+2,256+rx-9,y+ry-2)
                  d.arc(box2,195,345,fill=(224,250,255,min(210,alpha+55)),width=max(2,width-2))
          def droplet(im,x,y,r,alpha=230):
              d=ImageDraw.Draw(im)
              d.ellipse((x-r,y-r,x+r,y+r),fill=(91,202,245,alpha),outline=(225,250,255,min(255,alpha+20)),width=2)
              d.ellipse((x-r//3,y-r//2,x+r//5,y-r//5),fill=(255,255,255,min(210,alpha)))
          def splash(crown_h,crown_w,ripple_rx,droplets,fade=1.0):
              im=layer(); d=ImageDraw.Draw(im); base_y=372
              ripple(im,base_y+22,ripple_rx,14,int(120*fade),5)
              ripple(im,base_y+26,int(ripple_rx*.72),9,int(80*fade),3)
              if crown_h>0:
                  pts=[]; left=256-crown_w//2; right=256+crown_w//2; pts.append((left,base_y+10)); peaks=7
                  for i in range(peaks*2+1):
                      t=i/(peaks*2); x=left+(right-left)*t
                      if i%2: yy=base_y-crown_h*(0.48+0.52*math.sin(math.pi*t)**1.7)*(0.72+0.28*random.random())
                      else: yy=base_y+5-10*math.sin(math.pi*t)
                      pts.append((int(x),int(yy)))
                  pts.append((right,base_y+10)); d.polygon(pts,fill=(66,190,238,int(150*fade)))
                  inner=[(int(256+(x-256)*.68),int(base_y+(y-base_y)*.88)) for x,y in pts]
                  d.polygon(inner,fill=(168,233,252,int(115*fade)))
                  for k in (-2,-1,0,1,2):
                      x=256+k*26; top=base_y-int(crown_h*(.65 if k else .95)*(1-.09*abs(k)))
                      d.line((x,base_y-4,x+3,top),fill=(229,251,255,int(205*fade)),width=3)
              for x,y,r in droplets: droplet(im,x,y,r,int(225*fade))
              glow=Image.new('RGBA',(CELL,CELL),(0,0,0,0)); gd=ImageDraw.Draw(glow)
              gd.ellipse((150,base_y-22,362,base_y+48),fill=(67,181,235,int(34*fade)))
              glow=glow.filter(ImageFilter.GaussianBlur(14))
              return Image.alpha_composite(glow,im)
          frames=[layer(),splash(24,92,84,[(251,339,5),(274,350,3)],.65),splash(72,135,102,[(228,285,6),(281,302,5),(301,323,3)],.82),splash(126,166,122,[(251,208,8),(210,267,5),(307,255,6),(332,298,4)],1.0),splash(68,134,108,[(221,306,4),(303,296,5),(328,330,3)],.78),splash(12,78,94,[(279,344,3)],.46)]
          for i,im in enumerate(frames): out.alpha_composite(im,(i*CELL,0))
          p=Path('assets/art/game-scene/effects/water-splash-sheet.png'); p.parent.mkdir(parents=True,exist_ok=True)
          out.save(p,'PNG',compress_level=9,optimize=True)
          chk=Image.open(p); assert chk.size==(3072,512) and chk.mode=='RGBA'; assert chk.crop((0,0,512,512)).getbbox() is None
          print(p,chk.size,chk.mode,p.stat().st_size)
          PY
      - name: Commit generated PNG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/art/game-scene/effects/water-splash-sheet.png
          git commit -m 'feat: add water splash animation sheet [skip ci]' || exit 0
          git push
