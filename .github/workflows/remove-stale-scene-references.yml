name: Remove stale scene references

on:
  push:
    paths:
      - .github/workflows/remove-stale-scene-references.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-stale-scene-references
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove hidden legacy WebP and filter rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('assets/css/quiz-scene-composition.css')
          text = path.read_text(encoding='utf-8')
          old = 'background-image: url("../images/toad-expressions/toad-expression-sprite.webp") !important;'
          if old not in text:
              raise SystemExit('Legacy toad WebP declaration was not found')
          text = text.replace(old, 'background-image: none !important;')

          pattern = re.compile(
              r'\n\.jar-game-shell\[data-toad-skin="gold-worker"\] \.scene-toad-sprite \{.*?\}\n'
              r'\n\.jar-game-shell\[data-toad-skin="jade-guard"\] \.scene-toad-sprite \{.*?\}\n'
              r'\n\.jar-game-shell\[data-toad-skin="star-night"\] \.scene-toad-sprite \{.*?\}\n',
              re.S,
          )
          text, count = pattern.subn(
              '\n/* Toad skins are authored PNG layers in scene-renderer.js; no CSS recoloring fallback. */\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one legacy toad filter group, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY

          if grep -RInE 'toad-expression-sprite\.webp|scene-photo/jar-photo-|data:image/(jpeg|jpg)' \
            assets/css/quiz-scene-composition.css assets/js/theme-system.js; then
            echo 'Stale scene reference remains.' >&2
            exit 1
          fi

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-stale-scene-references.yml
          git add assets/css/quiz-scene-composition.css
          git commit -m 'refactor: remove legacy toad WebP styling'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
