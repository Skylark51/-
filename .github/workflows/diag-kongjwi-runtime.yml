name: Diagnose Kongjwi runtime crop
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-kongjwi-runtime.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Collect runtime sources
        shell: bash
        run: |
          mkdir -p diagnostics
          cp -R assets/js diagnostics/js
          cp -R assets/css diagnostics/css
          cp "콩쥐야_줘때써.html" diagnostics/game.html
          cp assets/art/game-scene/manifest.json diagnostics/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: kongjwi-runtime-sources
          path: diagnostics
          retention-days: 1