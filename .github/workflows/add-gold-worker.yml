name: Add Gold Worker Toad Asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-gold-worker.yml'
      - '.asset-jobs/gold-worker.txt'

permissions:
  contents: write

jobs:
  add-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and verify original PNG
        env:
          SOURCE_URL: 'https://oaisdmntprwestus2.blob.core.windows.net/files/00000000-3204-81f8-941d-91a5a62890b4/raw?se=2026-08-06T01%3A56%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=019fd4ba-ce20-7095-8edb-37353faf8712&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T23%3A23%3A33Z&ske=2026-08-06T23%3A23%3A33Z&sks=b&skv=2026-02-06&sig=tTTy%2BwIVidhp6rFwYB38PitFcRbpp91zizGi8/64Zjw%3D'
          EXPECTED_SHA256: 'c933dfd3b1a1ad903c099aab7fcda0778ebae97551ad00657b0e6123a430317a'
        run: |
          set -euo pipefail
          mkdir -p assets/art/game-scene/toad/skins
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o assets/art/game-scene/toad/skins/gold-worker.png
          echo "$EXPECTED_SHA256  assets/art/game-scene/toad/skins/gold-worker.png" | sha256sum -c -
          python3 - <<'PY'
          import struct
          path = 'assets/art/game-scene/toad/skins/gold-worker.png'
          with open(path, 'rb') as handle:
              header = handle.read(29)
          assert header[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          assert header[12:16] == b'IHDR', 'missing IHDR'
          width, height, bit_depth, color_type, compression, filter_method, interlace = struct.unpack('>IIBBBBB', header[16:29])
          assert (width, height) == (1024, 768), (width, height)
          assert bit_depth == 8, bit_depth
          assert color_type == 6, color_type
          assert compression == 0 and filter_method == 0, (compression, filter_method)
          print(f'validated {width}x{height} RGBA {bit_depth}-bit')
          PY
          file assets/art/game-scene/toad/skins/gold-worker.png

      - name: Commit and push asset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/game-scene/toad/skins/gold-worker.png
          git rm -f .asset-jobs/gold-worker.txt .github/workflows/add-gold-worker.yml
          git commit -m "feat(art): add gold worker toad skin"
          git push origin main
