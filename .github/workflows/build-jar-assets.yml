name: Build jar art assets

on:
  push:
    branches: [main]
    paths:
      - ".asset-staging/jars/**"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and crop jar assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/art/sprites
          cat .asset-staging/jars/no-toad/*.part | base64 --decode > /tmp/jars-no-toad.webp
          cat .asset-staging/jars/lid-open/*.part | base64 --decode > /tmp/jars-lid-open.webp

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          IM=convert
          if command -v magick >/dev/null 2>&1; then IM=magick; fi

          "$IM" /tmp/jars-no-toad.webp assets/art/sprites/jars.png
          cp /tmp/jars-lid-open.webp assets/art/sprites/jars-lid-open.webp

          names=(onggi celadon moon-white night-lacquer)
          for i in 0 1 2 3; do
            name="${names[$i]}"
            x=$((i * 96))
            mkdir -p "assets/art/jars/$name"
            "$IM" /tmp/jars-no-toad.webp -crop "96x96+${x}+0" +repage "assets/art/jars/$name/thumbnail-no-toad.png"
            "$IM" /tmp/jars-lid-open.webp -crop "96x96+${x}+0" +repage "assets/art/jars/$name/lid-open.png"
          done

          rm -rf .asset-staging/jars

      - name: Commit built jar assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/art/sprites/jars.png assets/art/sprites/jars-lid-open.webp assets/art/jars .asset-staging/jars
          git commit -m "feat: build jar thumbnail and lid-open assets [skip ci]" || exit 0
          git push
