name: Validate lobby navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/js/lobby-actions.js"
      - "assets/js/lobby-navigation.js"
      - "assets/js/lobby-logic.js"
      - "assets/js/lobby-hero-scene.js"
      - "assets/css/lobby-hero-scene.css"
      - "scripts/smoke-lobby-navigation.mjs"
      - ".github/workflows/lobby-navigation-regression.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check assets/js/lobby-navigation.js
          node --check assets/js/lobby-logic.js
          node --check assets/js/lobby-hero-scene.js
          node --check scripts/smoke-lobby-navigation.mjs
      - name: Install browser runtime
        run: |
          npm init -y
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/lobby-http.log 2>&1 &
          echo $! > /tmp/lobby-http.pid
      - name: Browser navigation smoke
        shell: bash
        run: |
          set +e
          node scripts/smoke-lobby-navigation.mjs > /tmp/lobby-smoke.out 2> /tmp/lobby-smoke.err
          status=$?
          cat /tmp/lobby-smoke.out
          cat /tmp/lobby-smoke.err >&2
          if [ "$status" -ne 0 ]; then
            message=$(tail -40 /tmp/lobby-smoke.err | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Lobby browser smoke::$message"
            exit "$status"
          fi
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-navigation-diagnostics
          path: |
            /tmp/lobby-http.log
            /tmp/lobby-smoke.out
            /tmp/lobby-smoke.err
            /tmp/lobby-*-failure.png
          if-no-files-found: ignore
