name: Generate moon ladle prompt 12

on:
  push:
    branches: [main]
    paths:
      - scripts/temp_generate_moon_ladle_prompt12.py
      - .github/workflows/temp-generate-moon-ladle-prompt12.yml

permissions:
  contents: write

concurrency:
  group: temp-generate-moon-ladle-prompt12
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate RGBA PNG sprite sheet
        run: python scripts/temp_generate_moon_ladle_prompt12.py

      - name: Validate output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('assets/art/game-scene/tools/moon/pour-sheet.png')
          image = Image.open(path)
          assert image.format == 'PNG', image.format
          assert image.size == (4096, 512), image.size
          assert image.mode == 'RGBA', image.mode
          assert image.getchannel('A').getextrema() == (0, 255)
          print(f'{path}: {image.size[0]}x{image.size[1]}, {image.mode}, {path.stat().st_size} bytes')
          PY

      - name: Commit generated PNG and remove temporary generator
        shell: bash
        run: |
          rm -f scripts/temp_generate_moon_ladle_prompt12.py
          rm -f .github/workflows/temp-generate-moon-ladle-prompt12.yml
          git config user.name 'Skylark51'
          git config user.email '89302052+Skylark51@users.noreply.github.com'
          git add assets/art/game-scene/tools/moon/pour-sheet.png \
            scripts/temp_generate_moon_ladle_prompt12.py \
            .github/workflows/temp-generate-moon-ladle-prompt12.yml
          git commit -m 'feat: add moonlight ladle pour sprite'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
