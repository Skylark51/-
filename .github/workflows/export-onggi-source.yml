name: Export onggi source

on:
  push:
    branches:
      - agent/export-onggi-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source
        run: file assets/art/jars/onggi/lid-open.png
      - name: Upload source image
        uses: actions/upload-artifact@v4
        with:
          name: onggi-source
          path: assets/art/jars/onggi/lid-open.png
          if-no-files-found: error
          retention-days: 1
