name: Build Kongjwi pour motion sheets

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-kongjwi-pour-sheets.py"
      - "assets/art/kongjwi/*-cutout.png"
      - "tests/kongjwi-pour-motion.test.mjs"
      - ".github/workflows/build-kongjwi-pour-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PNG build dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build Kongjwi pour sheets
        run: python scripts/build-kongjwi-pour-sheets.py

      - name: Validate pour animation pipeline
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/kongjwi-pour-motion.test.mjs
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          skins = ("underlayer", "classic-red", "blue-scholar", "field-work", "ragged", "night-court")
          for skin in skins:
              path = Path("assets/art/game-scene/kongjwi") / skin / "pour-sheet.png"
              image = Image.open(path)
              assert image.format == "PNG", (skin, image.format)
              assert image.mode == "RGBA", (skin, image.mode)
              assert image.size == (4096, 768), (skin, image.size)
          PY
          git diff --check

      - name: Commit generated Kongjwi motion assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/game-scene/manifest.json assets/art/game-scene/kongjwi
          if git diff --cached --quiet; then
            echo "No Kongjwi motion changes."
            exit 0
          fi
          git commit -m "feat: enable Kongjwi bucket-pour motion [skip ci]"
          git push
