name: Build Kongjwi pour motion sheets

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-kongjwi-pour-sheets.py"
      - "assets/art/kongjwi/*-cutout.png"
      - "assets/art/kongjwi-tools/*.png"
      - "assets/art/game-scene/tools/*/master.png"
      - "assets/art/game-scene/tools/*/pour-sheet.png"
      - "tests/kongjwi-pour-motion.test.mjs"
      - "tests/kongjwi-underlayer-grip.test.mjs"
      - ".github/workflows/build-kongjwi-pour-motion.yml"
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Regenerate all sheets from authored/canonical PNG masters"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PNG build dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Apply permanent foreground ordering fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          builder_path = Path("scripts/build-kongjwi-pour-sheets.py")
          builder = builder_path.read_text(encoding="utf-8")
          builder = builder.replace(
              'manifest["version"] = "20260808-head-safe2"',
              'manifest["version"] = "20260808-layer-safe1"'
          )
          needle = '    manifest["layers"]["scene-tool"] = 11\n'
          replacement = needle + '    manifest["layers"]["scene-foreground"] = 5\n'
          if 'manifest["layers"]["scene-foreground"] = 5' not in builder:
              if needle not in builder:
                  raise SystemExit("scene-tool layer assignment not found in builder")
              builder = builder.replace(needle, replacement, 1)
          builder_path.write_text(builder, encoding="utf-8")

          for test_path in [
              Path("tests/kongjwi-pour-motion.test.mjs"),
              Path("tests/kongjwi-underlayer-grip.test.mjs"),
          ]:
              text = test_path.read_text(encoding="utf-8")
              if '"20260808-layer-safe1"' not in text:
                  text = text.replace(
                      '"20260808-head-safe2"',
                      '"20260808-head-safe2", "20260808-layer-safe1"'
                  )
              test_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/kongjwi-pour-motion.test.mjs")
          text = test_path.read_text(encoding="utf-8")
          ordering_assert = '  assert.ok(manifest.layers["scene-foreground"] < manifest.layers["scene-kongjwi"], "foreground must not occlude Kongjwi");\n'
          anchor = '  assert.deepEqual(manifest.placements.tool, manifest.placements.kongjwi);\n'
          if ordering_assert not in text:
              if anchor not in text:
                  raise SystemExit("test anchor not found")
              text = text.replace(anchor, anchor + ordering_assert, 1)
          test_path.write_text(text, encoding="utf-8")
          PY

      - name: Determine whether motion rig must be regenerated
        id: source-change
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          FORCE_DISPATCH: ${{ inputs.regenerate }}
        run: |
          set -euo pipefail
          args=""
          if [[ "$FORCE_DISPATCH" == "true" ]]; then
            args="--force"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
              'scripts/build-kongjwi-pour-sheets.py' \
              'assets/art/kongjwi/*-cutout.png' \
              'assets/art/kongjwi-tools/*.png' \
              'assets/art/game-scene/tools/*/master.png' \
              'tests/kongjwi-pour-motion.test.mjs' \
              'tests/kongjwi-underlayer-grip.test.mjs' \
              '.github/workflows/build-kongjwi-pour-motion.yml' | grep -q .; then
              args="--force"
            fi
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build generated motion sheets
        run: python scripts/build-kongjwi-pour-sheets.py ${{ steps.source-change.outputs.args }}

      - name: Validate generated animation assets
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/kongjwi-pour-motion.test.mjs tests/kongjwi-underlayer-grip.test.mjs
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import importlib.util
          import numpy as np
          import json

          skins = ("underlayer", "classic-red", "blue-scholar", "field-work", "ragged", "night-court")
          tools = ("wood", "brass", "celadon", "moon")

          spec = importlib.util.spec_from_file_location("kongjwi_builder", Path("scripts/build-kongjwi-pour-sheets.py"))
          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)

          current_face, donor_face = builder.night_head_coverage(Path("."))
          minimum_face = round(donor_face * builder.NIGHT_FACE_REQUIRED_RATIO)
          assert donor_face >= builder.NIGHT_FACE_MIN_DONOR_COVERAGE, donor_face
          assert current_face >= minimum_face, (
              f"night-court face/head alpha is incomplete: {current_face} < {minimum_face}"
          )

          manifest = json.loads(Path("assets/art/game-scene/manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "20260808-layer-safe1"
          assert manifest["runtimePolicy"]["anatomySafetyPolicy"] == "complete-source-required-no-headless-cutouts"
          assert manifest["layers"]["scene-tool"] > manifest["layers"]["scene-kongjwi"]
          assert manifest["layers"]["scene-foreground"] < manifest["layers"]["scene-kongjwi"]

          for skin in skins:
              path = Path("assets/art/game-scene/kongjwi") / skin / "pour-sheet.png"
              image = Image.open(path).convert("RGBA")
              assert image.size == (4096, 768), (skin, image.size)
              source = builder.load_rgba(Path("assets/art/kongjwi") / builder.SOURCES[skin])
              base = builder.fit_source(source)
              for index, pose in enumerate(builder.BODY_POSES):
                  expected = np.asarray(builder.pose_frame(base, *pose), dtype=np.uint8)
                  actual = np.asarray(image.crop((index * 512, 0, (index + 1) * 512, 768)), dtype=np.uint8)
                  assert np.array_equal(actual, expected), f"{skin} frame {index}: complete source anatomy was altered"

          for tool in tools:
              base = Path("assets/art/game-scene/tools") / tool
              master = Image.open(base / "master.png").convert("RGBA")
              assert master.getchannel("A").getbbox(), f"{tool} canonical master is empty"
              image = Image.open(base / "pour-sheet.png").convert("RGBA")
              assert image.size == (4096, 768), (tool, image.size)
              first = np.asarray(image.crop((0, 0, 512, 768)), dtype=np.int16)
              fifth = np.asarray(image.crop((5 * 512, 0, 6 * 512, 768)), dtype=np.int16)
              assert np.count_nonzero(np.any(np.abs(first - fifth) > 12, axis=2)) > 100, tool
          PY
          git diff --check

      - name: Commit permanent layer fix and generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build-kongjwi-pour-sheets.py \
            tests/kongjwi-pour-motion.test.mjs \
            tests/kongjwi-underlayer-grip.test.mjs \
            assets/art/kongjwi/kongjwi-night-court-cutout.png \
            assets/art/game-scene/manifest.json \
            assets/art/game-scene/kongjwi/*/pour-sheet.png \
            assets/art/game-scene/tools/*/master.png \
            assets/art/game-scene/tools/*/pour-sheet.png
          if git diff --cached --quiet; then
            echo "No Kongjwi layer changes."
            exit 0
          fi
          git commit -m "fix: keep foreground behind Kongjwi actors [skip ci]"
          git pull --rebase origin main
          git push