name: Build Kongjwi pour motion sheets

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-kongjwi-pour-sheets.py"
      - "assets/art/kongjwi/*-cutout.png"
      - "assets/art/game-scene/tools/*/pour-sheet.png"
      - "tests/kongjwi-pour-motion.test.mjs"
      - "tests/kongjwi-underlayer-grip.test.mjs"
      - ".github/workflows/build-kongjwi-pour-motion.yml"
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Regenerate sheets after an authored Kongjwi source change"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PNG build dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Determine whether authored source changed
        id: source-change
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          FORCE_DISPATCH: ${{ inputs.regenerate }}
        run: |
          set -euo pipefail
          args=""
          if [[ "$FORCE_DISPATCH" == "true" ]]; then
            args="--force"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- 'assets/art/kongjwi/*-cutout.png' | grep -q .; then
              args="--force"
            fi
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build generated motion sheets
        run: python scripts/build-kongjwi-pour-sheets.py ${{ steps.source-change.outputs.args }}

      - name: Validate generated animation assets
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/kongjwi-pour-motion.test.mjs tests/kongjwi-underlayer-grip.test.mjs
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          skins = ("underlayer", "classic-red", "blue-scholar", "field-work", "ragged", "night-court")
          tools = ("wood", "brass", "celadon", "moon")

          for skin in skins:
              path = Path("assets/art/game-scene/kongjwi") / skin / "pour-sheet.png"
              image = Image.open(path).convert("RGBA")
              assert image.size == (4096, 768), (skin, image.size)

          underlayer = Image.open("assets/art/game-scene/kongjwi/underlayer/pour-sheet.png").convert("RGBA")
          idle = np.asarray(underlayer.crop((0, 0, 512, 768)), dtype=np.int16)
          pour = np.asarray(underlayer.crop((5 * 512, 0, 6 * 512, 768)), dtype=np.int16)
          wrong = np.asarray(underlayer.crop((7 * 512, 0, 8 * 512, 768)), dtype=np.int16)
          assert np.count_nonzero(np.any(np.abs(idle - pour) > 12, axis=2)) > 500
          assert np.count_nonzero(np.any(np.abs(idle - wrong) > 12, axis=2)) > 500

          for tool in tools:
              path = Path("assets/art/game-scene/tools") / tool / "pour-sheet.png"
              image = Image.open(path).convert("RGBA")
              assert image.size == (4096, 768), (tool, image.size)
              first = np.asarray(image.crop((0, 0, 512, 768)), dtype=np.int16)
              fifth = np.asarray(image.crop((5 * 512, 0, 6 * 512, 768)), dtype=np.int16)
              assert np.count_nonzero(np.any(np.abs(first - fifth) > 12, axis=2)) > 100
          PY
          git diff --check

      - name: Commit generated motion assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/art/game-scene/manifest.json \
            assets/art/game-scene/kongjwi/*/pour-sheet.png \
            assets/art/game-scene/tools/*/pour-sheet.png
          if git diff --cached --quiet; then
            echo "No Kongjwi motion asset changes."
            exit 0
          fi
          git commit -m "chore: refresh Kongjwi motion sheets [skip ci]"
          git push
