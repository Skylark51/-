name: Build Kongjwi pour motion sheets

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-kongjwi-pour-sheets.py"
      - "scripts/apply-underlayer-grip-runtime.py"
      - "assets/art/kongjwi/*-cutout.png"
      - "assets/art/kongjwi-tools/*.png"
      - "tests/kongjwi-pour-motion.test.mjs"
      - "tests/kongjwi-underlayer-grip.test.mjs"
      - ".github/workflows/build-kongjwi-pour-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PNG build dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Build articulated underlayer and equipped bucket sheets
        run: python scripts/build-kongjwi-pour-sheets.py

      - name: Apply underlayer runtime wiring
        run: python scripts/apply-underlayer-grip-runtime.py

      - name: Validate animation pipeline
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/kongjwi-pour-motion.test.mjs tests/kongjwi-underlayer-grip.test.mjs
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          skins = ("underlayer", "classic-red", "blue-scholar", "field-work", "ragged", "night-court")
          tools = ("wood", "brass", "celadon", "moon")

          for skin in skins:
              path = Path("assets/art/game-scene/kongjwi") / skin / "pour-sheet.png"
              image = Image.open(path).convert("RGBA")
              assert image.size == (4096, 768), (skin, image.size)

          underlayer = Image.open("assets/art/game-scene/kongjwi/underlayer/pour-sheet.png").convert("RGBA")
          idle = np.asarray(underlayer.crop((0, 0, 512, 768)), dtype=np.int16)
          pour = np.asarray(underlayer.crop((5 * 512, 0, 6 * 512, 768)), dtype=np.int16)
          wrong = np.asarray(underlayer.crop((7 * 512, 0, 8 * 512, 768)), dtype=np.int16)
          pour_changed = np.count_nonzero(np.any(np.abs(idle - pour) > 12, axis=2))
          wrong_changed = np.count_nonzero(np.any(np.abs(idle - wrong) > 12, axis=2))
          assert pour_changed > 500, f"pour pose is not materially different: {pour_changed}"
          assert wrong_changed > 500, f"wrong pose is not materially different: {wrong_changed}"

          for tool in tools:
              path = Path("assets/art/game-scene/tools") / tool / "pour-sheet.png"
              image = Image.open(path).convert("RGBA")
              assert image.size == (4096, 768), (tool, image.size)
              first = np.asarray(image.crop((0, 0, 512, 768)), dtype=np.int16)
              fifth = np.asarray(image.crop((5 * 512, 0, 6 * 512, 768)), dtype=np.int16)
              changed = np.count_nonzero(np.any(np.abs(first - fifth) > 12, axis=2))
              assert changed > 100, f"{tool} bucket does not visibly move: {changed}"
          PY
          git diff --check

      - name: Commit generated motion assets and runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/art/game-scene/manifest.json \
            assets/art/game-scene/kongjwi \
            assets/art/game-scene/tools \
            assets/js/scene-renderer.js \
            assets/js/visible-water-pour.js \
            assets/js/game-cosmetics-entry.js \
            assets/js/ui-effects.js \
            assets/css/scene-source-aspect-fix.css \
            assets/css/layered-scene-runtime.css \
            data/shop-catalog.js \
            shop.html \
            "콩쥐야_줘때써.html"
          if git diff --cached --quiet; then
            echo "No Kongjwi motion changes."
            exit 0
          fi
          git commit -m "fix: force refreshed Kongjwi motion assets [skip ci]"
          git push
