name: Build Kongjwi pour motion sheets

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-kongjwi-pour-sheets.py"
      - "scripts/apply-underlayer-grip-runtime.py"
      - "assets/art/kongjwi/*-cutout.png"
      - "assets/art/kongjwi-tools/wood.png"
      - "tests/kongjwi-pour-motion.test.mjs"
      - "tests/kongjwi-underlayer-grip.test.mjs"
      - "콩쥐야_줘때써.html"
      - "shop.html"
      - ".github/workflows/build-kongjwi-pour-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PNG build dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build frame-locked Kongjwi pour sheets
        run: python scripts/build-kongjwi-pour-sheets.py

      - name: Apply underlayer grip runtime wiring
        run: |
          python scripts/apply-underlayer-grip-runtime.py
          python - <<'PY'
          from pathlib import Path
          path = Path("콩쥐야_줘때써.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'data-ui-version="20260807-records-analytics1"',
              'data-ui-version="20260807-underlayer-grip1"',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate pour animation pipeline
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/kongjwi-pour-motion.test.mjs tests/kongjwi-underlayer-grip.test.mjs
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          skins = ("underlayer", "classic-red", "blue-scholar", "field-work", "ragged", "night-court")
          for skin in skins:
              path = Path("assets/art/game-scene/kongjwi") / skin / "pour-sheet.png"
              image = Image.open(path)
              assert image.format == "PNG", (skin, image.format)
              assert image.mode == "RGBA", (skin, image.mode)
              assert image.size == (4096, 768), (skin, image.size)

          grip = Path("assets/art/game-scene/kongjwi/underlayer/wood-grip-sheet.png")
          image = Image.open(grip)
          assert image.format == "PNG"
          assert image.mode == "RGBA"
          assert image.size == (4096, 768)
          assert image.getchannel("A").getbbox(), "integrated grip must contain visible pixels"
          PY
          git diff --check

      - name: Commit generated Kongjwi motion assets and runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/art/game-scene/manifest.json \
            assets/art/game-scene/kongjwi \
            assets/js/scene-renderer.js \
            assets/js/visible-water-pour.js \
            assets/js/game-cosmetics-entry.js \
            assets/js/ui-effects.js \
            assets/js/shop-navigation.js \
            data/shop-catalog.js \
            shop.html \
            "콩쥐야_줘때써.html"
          if git diff --cached --quiet; then
            echo "No Kongjwi grip changes."
            exit 0
          fi
          git commit -m "feat: lock underlayer bucket grip to source frame [skip ci]"
          git push
