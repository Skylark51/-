name: Keypad regression

on:
  push:
    paths:
      - "assets/js/mobile-keypad.js"
      - "assets/js/quiz-shell-controls.js"
      - "assets/css/mobile-keypad-original.css"
      - "콩쥐야_줘때써.html"
      - "tests/keypad-regression.mjs"
      - ".github/workflows/keypad-regression.yml"
  pull_request:
    paths:
      - "assets/js/mobile-keypad.js"
      - "assets/js/quiz-shell-controls.js"
      - "assets/css/mobile-keypad-original.css"
      - "콩쥐야_줘때써.html"
      - "tests/keypad-regression.mjs"
      - ".github/workflows/keypad-regression.yml"

permissions:
  contents: read

jobs:
  keypad-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify keypad invariants
        run: node tests/keypad-regression.mjs
