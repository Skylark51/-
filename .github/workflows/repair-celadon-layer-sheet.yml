name: Repair celadon layer sheet

on:
  push:
    paths:
      - .github/workflows/repair-celadon-layer-sheet.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-celadon-layer-sheet
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install lossless PNG tooling
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Recover and reframe source panels without resampling
        shell: bash
        run: |
          set -euo pipefail
          TARGET='assets/art/game-scene/jars/celadon/layers.png'
          mkdir -p "$(dirname "$TARGET")"
          git show 8305c2d85f42abbaf7683364a7e3576204dd6eb8:"$TARGET" > /tmp/celadon-source.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          target = 'assets/art/game-scene/jars/celadon/layers.png'
          source_path = Path('/tmp/celadon-source.png')
          target_path = Path(target)
          repaired_path = Path('/tmp/celadon-repaired.png')
          manifest_path = Path('assets/art/game-scene/manifest.json')
          repaired_manifest_path = Path('/tmp/manifest-repaired.json')

          image = Image.open(source_path)
          image.load()
          if image.mode != 'RGBA' or image.size != (1536, 1024):
              raise SystemExit(f'Unexpected source: size={image.size}, mode={image.mode}')

          # The source has two equal 768x1024 authored panels. Every source pixel is
          # retained verbatim inside a 1024x1024 cell; only transparent gutters are added.
          left = image.crop((0, 0, 768, 1024))
          right = image.crop((768, 0, 1536, 1024))
          output = Image.new('RGBA', (2048, 1024), (0, 0, 0, 0))
          output.alpha_composite(left, (128, 0))
          output.alpha_composite(right, (1152, 0))

          if ImageChops.difference(output.crop((128, 0, 896, 1024)), left).getbbox() is not None:
              raise SystemExit('Left panel pixel-integrity check failed')
          if ImageChops.difference(output.crop((1152, 0, 1920, 1024)), right).getbbox() is not None:
              raise SystemExit('Right panel pixel-integrity check failed')

          output.save(repaired_path, format='PNG', compress_level=9, optimize=False)
          target_path.write_bytes(repaired_path.read_bytes())
          check = Image.open(target_path)
          check.load()
          if check.size != (2048, 1024) or check.mode != 'RGBA':
              raise SystemExit(f'Invalid repaired PNG: size={check.size}, mode={check.mode}')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['availability'][target] = True
          repaired_manifest = json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          manifest_path.write_text(repaired_manifest, encoding='utf-8')
          repaired_manifest_path.write_text(repaired_manifest, encoding='utf-8')

          print(f'left alpha bbox={left.getchannel("A").getbbox()}')
          print(f'right alpha bbox={right.getchannel("A").getbbox()}')
          print(f'Repaired PNG: 2048x1024, RGBA, bytes={target_path.stat().st_size}')
          print('Manifest availability map restored to true.')
          PY

      - name: Validate layered scene assets
        run: node scripts/validate-layered-scene.mjs

      - name: Commit and push repaired PNG
        shell: bash
        run: |
          set -euo pipefail
          TARGET='assets/art/game-scene/jars/celadon/layers.png'
          MANIFEST='assets/art/game-scene/manifest.json'
          WORKFLOW='.github/workflows/repair-celadon-layer-sheet.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          stage_repair() {
            mkdir -p "$(dirname "$TARGET")"
            cp /tmp/celadon-repaired.png "$TARGET"
            cp /tmp/manifest-repaired.json "$MANIFEST"
            rm -f "$WORKFLOW"
            git add "$TARGET" "$MANIFEST"
            git add -u -- "$WORKFLOW" || true
          }

          stage_repair
          git commit -m 'fix: restore celadon jar layer sheet dimensions'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            stage_repair
            if git diff --cached --quiet; then
              echo 'Repair is already present on main.'
              exit 0
            fi
            git commit -m 'fix: restore celadon jar layer sheet dimensions'
            sleep 2
          done
          exit 1
