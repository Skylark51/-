name: Validate layered quiz scene

# Missing planned assets are reported for follow-up; authored files and availability mismatches fail the build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "콩쥐야_줘때써.html"
      - "data/questions.js"
      - "data/questions/index.js"
      - "data/questions/atomic-number.js"
      - "assets/art/game-scene/**"
      - "assets/js/main.js"
      - "assets/js/ui-effects.js"
      - "assets/js/scene-renderer.js"
      - "assets/js/scene-state-machine.js"
      - "assets/js/game-cosmetics-entry.js"
      - "assets/js/quiz-shell-controls.js"
      - "assets/js/quiz-scene-actors.js"
      - "assets/js/result-panel-enhancements.js"
      - "assets/css/game-asset-animation.css"
      - "assets/css/atomic-number-speed-start.css"
      - "assets/css/toad-composition-fix.css"
      - "assets/css/toad-hole-integration.css"
      - "assets/css/jar-water-surface-fix.css"
      - "assets/css/jar-mouth-hole-polish.css"
      - "assets/css/mobile-quiz-balance.css"
      - "assets/css/quiz-mobile-polish.css"
      - "assets/css/quiz-scene-actors.css"
      - "assets/css/layered-scene-runtime.css"
      - "assets/css/result-panel-enhancements.css"
      - "scripts/validate-layered-scene.mjs"
      - "scripts/smoke-layered-scene.mjs"
      - "scripts/smoke-quiz-interface.mjs"
      - "tests/layered-scene.test.mjs"
      - "tests/mobile-scene-regression.test.mjs"
      - "tests/toad-composition-regression.test.mjs"
      - "tests/jar-water-surface-regression.test.mjs"
      - "tests/jar-mouth-hole-regression.test.mjs"
      - "tests/atomic-number-start-regression.test.mjs"
      - "tests/result-panel-regression.test.mjs"
      - "docs/prompts/QUIZ_MOBILE_INTERFACE_POLISH_20260807.md"
      - "docs/prompts/QUIZ_TOAD_HOLE_INTEGRATION_FIX_20260807.md"
      - "docs/prompts/QUIZ_JAR_WATER_SURFACE_FIX_20260807.md"
      - "docs/prompts/QUIZ_JAR_MOUTH_HOLE_POLISH_20260807.md"
      - "docs/prompts/ATOMIC_NUMBER_FLASH_COUNTDOWN_FIX_20260807.md"
      - ".github/workflows/validate-layered-scene.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check data/questions/atomic-number.js
          node --check data/questions/index.js
          node --check assets/js/main.js
          node --check assets/js/ui-effects.js
          node --check assets/js/scene-renderer.js
          node --check assets/js/scene-state-machine.js
          node --check assets/js/game-cosmetics-entry.js
          node --check assets/js/quiz-scene-actors.js
          node --check assets/js/result-panel-enhancements.js
          node --check scripts/smoke-quiz-interface.mjs
      - name: Layer architecture tests
        run: >-
          node --test
          tests/layered-scene.test.mjs
          tests/mobile-scene-regression.test.mjs
          tests/toad-composition-regression.test.mjs
          tests/jar-water-surface-regression.test.mjs
          tests/jar-mouth-hole-regression.test.mjs
          tests/atomic-number-start-regression.test.mjs
          tests/result-panel-regression.test.mjs
      - name: PNG and legacy-path validation
        shell: bash
        run: |
          set +e
          node scripts/validate-layered-scene.mjs > /tmp/layered-validation.out 2> /tmp/layered-validation.err
          status=$?
          cat /tmp/layered-validation.out
          cat /tmp/layered-validation.err >&2
          if [ "$status" -ne 0 ]; then
            cat /tmp/layered-validation.out /tmp/layered-validation.err \
              | grep -E '^(AVAILABILITY|INVALID|FORBIDDEN|OBSOLETE)' \
              | head -20 \
              | while IFS= read -r line; do echo "::error title=Layered scene validation::$line"; done
            exit "$status"
          fi
      - name: Install browser smoke-test runtime
        run: |
          npm init -y
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/layered-scene-http.log 2>&1 &
          echo $! > /tmp/layered-scene-http.pid
      - name: Responsive browser smoke test
        shell: bash
        run: |
          set +e
          node scripts/smoke-layered-scene.mjs > /tmp/layered-smoke.out 2> /tmp/layered-smoke.err
          status=$?
          cat /tmp/layered-smoke.out
          cat /tmp/layered-smoke.err >&2
          if [ "$status" -ne 0 ]; then
            message=$(tail -40 /tmp/layered-smoke.err | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Layered browser smoke::$message"
            exit "$status"
          fi
      - name: 367x662 screenshot interface regression
        shell: bash
        run: |
          set +e
          node scripts/smoke-quiz-interface.mjs > /tmp/quiz-interface-smoke.out 2> /tmp/quiz-interface-smoke.err
          status=$?
          cat /tmp/quiz-interface-smoke.out
          cat /tmp/quiz-interface-smoke.err >&2
          if [ "$status" -ne 0 ]; then
            message=$(tail -40 /tmp/quiz-interface-smoke.err | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=367x662 quiz interface::$message"
            exit "$status"
          fi
      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layered-scene-diagnostics
          path: |
            /tmp/layered-scene-http.log
            /tmp/layered-smoke.out
            /tmp/layered-smoke.err
            /tmp/quiz-interface-smoke.out
            /tmp/quiz-interface-smoke.err
            /tmp/quiz-interface-367x662.png
          if-no-files-found: ignore
