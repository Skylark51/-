name: Build night lacquer jar layers

on:
  push:
    branches:
      - agent/prompt-16-night-lacquer
    paths:
      - .github/scripts/build-night-lacquer-layers.py
      - .github/workflows/build-night-lacquer-layers.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out upload branch
        uses: actions/checkout@v4
        with:
          ref: agent/prompt-16-night-lacquer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow scipy zopfli

      - name: Build and validate layered PNG
        run: python .github/scripts/build-night-lacquer-layers.py | tee /tmp/night-lacquer-report.json

      - name: Record file-level validation
        run: |
          file assets/art/game-scene/jars/night-lacquer/layers.png
          sha256sum assets/art/game-scene/jars/night-lacquer/layers.png
          stat --printf='bytes=%s\n' assets/art/game-scene/jars/night-lacquer/layers.png

      - name: Commit generated asset and remove one-time builder
        run: |
          rm -f .github/scripts/build-night-lacquer-layers.py
          rm -f .github/workflows/build-night-lacquer-layers.yml
          rmdir .github/scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/art/game-scene/jars/night-lacquer/layers.png .github
          git commit -m 'feat: add night lacquer jar layers'
          git push origin HEAD:agent/prompt-16-night-lacquer
