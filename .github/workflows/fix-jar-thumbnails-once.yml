name: One-time jar thumbnail cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-jar-thumbnails-once.yml

permissions:
  contents: write

jobs:
  clean-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow opencv-python-headless numpy

      - name: Create transparent jar cutouts and patch renderer
        run: python scripts/fix_jar_thumbnails_once.py

      - name: Install browser verification tooling
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Verify the actual mobile shop screen
        run: |
          python -m http.server 8765 > /tmp/kongjwi-shop-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 442, height: 820 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });

            await page.goto('http://127.0.0.1:8765/shop.html#jar', { waitUntil: 'networkidle' });
            await page.waitForFunction(() => {
              const images = [...document.querySelectorAll('.shop-jar-image')];
              return images.length === 4 && images.every(image => image.complete && image.naturalWidth === 512 && image.naturalHeight === 512);
            });

            const result = await page.evaluate(() => {
              const visuals = [...document.querySelectorAll('.shop-item[data-category="jar"] .shop-item-visual')];
              const images = [...document.querySelectorAll('.shop-item[data-category="jar"] .shop-jar-image')];
              return {
                visualCount: visuals.length,
                imageCount: images.length,
                frames: visuals.map(visual => {
                  const before = getComputedStyle(visual, '::before');
                  const after = getComputedStyle(visual, '::after');
                  const style = getComputedStyle(visual);
                  return {
                    beforeDisplay: before.display,
                    beforeContent: before.content,
                    afterDisplay: after.display,
                    afterContent: after.content,
                    backgroundImage: style.backgroundImage,
                    borderTopWidth: style.borderTopWidth,
                    borderRadius: style.borderRadius
                  };
                }),
                images: images.map(image => ({
                  naturalWidth: image.naturalWidth,
                  naturalHeight: image.naturalHeight,
                  objectFit: getComputedStyle(image).objectFit,
                  objectPosition: getComputedStyle(image).objectPosition
                }))
              };
            });

            if (result.visualCount !== 4 || result.imageCount !== 4) {
              throw new Error(`Expected four jar cards, received ${JSON.stringify(result)}`);
            }
            for (const frame of result.frames) {
              if (frame.beforeDisplay !== 'none' || frame.afterDisplay !== 'none') {
                throw new Error(`A jar pseudo-frame is still rendered: ${JSON.stringify(frame)}`);
              }
              if (frame.backgroundImage !== 'none' || frame.borderTopWidth !== '0px') {
                throw new Error(`A jar visual background or border remains: ${JSON.stringify(frame)}`);
              }
            }
            for (const image of result.images) {
              if (image.objectFit !== 'contain' || !image.objectPosition.startsWith('50%')) {
                throw new Error(`Jar image fit is incorrect: ${JSON.stringify(image)}`);
              }
            }

            await page.screenshot({ path: 'jar-mobile-verification.png', fullPage: true });
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload verification images
        uses: actions/upload-artifact@v4
        with:
          name: jar-clean-verification
          retention-days: 1
          if-no-files-found: error
          path: |
            jar-clean-preview.png
            jar-mobile-verification.png

      - name: Remove one-time tooling
        run: |
          git rm .github/workflows/fix-jar-thumbnails-once.yml scripts/fix_jar_thumbnails_once.py
          rm -f jar-clean-preview.png jar-mobile-verification.png package-lock.json
          rm -rf node_modules

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/jars/onggi/thumbnail-no-toad.png \
                  assets/art/jars/celadon/thumbnail-no-toad.png \
                  assets/art/jars/moon-white/thumbnail-no-toad.png \
                  assets/art/jars/night-lacquer/thumbnail-no-toad.png \
                  assets/css/shop-outfit-layout.css \
                  assets/js/shop-navigation.js \
                  shop.html \
                  .github/workflows/fix-jar-thumbnails-once.yml \
                  scripts/fix_jar_thumbnails_once.py
          git commit -m "fix: remove embedded frames from jar thumbnails"
          git push origin HEAD:main
