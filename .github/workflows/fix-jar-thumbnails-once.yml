name: One-time jar thumbnail export

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-jar-thumbnails-once.yml

permissions:
  contents: read

jobs:
  export-jar-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload current jar thumbnails
        uses: actions/upload-artifact@v4
        with:
          name: jar-thumbnails-original
          retention-days: 1
          if-no-files-found: error
          path: |
            assets/art/jars/onggi/thumbnail-no-toad.png
            assets/art/jars/celadon/thumbnail-no-toad.png
            assets/art/jars/moon-white/thumbnail-no-toad.png
            assets/art/jars/night-lacquer/thumbnail-no-toad.png
