name: One-time jar thumbnail cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-jar-thumbnails-once.yml

permissions:
  contents: write

jobs:
  clean-jar-thumbnails:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow opencv-python-headless numpy

      - name: Remove embedded frames and normalize thumbnails
        run: python scripts/fix_jar_thumbnails_once.py

      - name: Remove one-time tooling
        run: git rm .github/workflows/fix-jar-thumbnails-once.yml scripts/fix_jar_thumbnails_once.py

      - name: Commit cleaned assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/jars/onggi/thumbnail-no-toad.png \
                  assets/art/jars/celadon/thumbnail-no-toad.png \
                  assets/art/jars/moon-white/thumbnail-no-toad.png \
                  assets/art/jars/night-lacquer/thumbnail-no-toad.png \
                  assets/js/shop-navigation.js \
                  shop.html
          git commit -m "fix: remove embedded frames from jar thumbnails"
          git push origin HEAD:main
