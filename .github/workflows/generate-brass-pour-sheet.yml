name: Generate brass ladle sprite

on:
  push:
    paths:
      - .github/workflows/generate-brass-pour-sheet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate RGBA PNG sprite sheet
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          import random

          CELL = 512
          SCALE = 4
          W = H = CELL * SCALE

          def sc(value):
              return int(round(value * SCALE))

          def draw_ladle(angle=0, dx=0, dy=0, seed=91):
              base = Image.new('RGBA', (W, H), (0, 0, 0, 0))
              draw = ImageDraw.Draw(base, 'RGBA')

              p0 = (sc(278), sc(258))
              p1 = (sc(409), sc(95))

              def stroke(points, fill, width):
                  draw.line(points, fill=fill, width=sc(width), joint='curve')

              stroke([p0, p1], (55, 32, 5, 255), 28)
              stroke([p0, p1], (185, 112, 12, 255), 23)
              stroke([(p0[0] - sc(2), p0[1] - sc(2)),
                      (p1[0] - sc(2), p1[1] - sc(2))],
                     (255, 207, 78, 220), 7)
              stroke([(p0[0] + sc(5), p0[1] + sc(5)),
                      (p1[0] + sc(5), p1[1] + sc(5))],
                     (104, 55, 5, 140), 5)

              x, y = p1
              draw.ellipse((x - sc(14), y - sc(14), x + sc(14), y + sc(14)),
                           fill=(65, 34, 4, 255))
              draw.ellipse((x - sc(11), y - sc(11), x + sc(11), y + sc(11)),
                           fill=(197, 121, 13, 255))
              draw.ellipse((x - sc(8), y - sc(9), x + sc(5), y + sc(5)),
                           fill=(255, 208, 76, 210))

              mask = Image.new('L', (W, H), 0)
              md = ImageDraw.Draw(mask)
              points = []
              for index in range(31):
                  t = index / 30
                  px = (1-t)**2 * 158 + 2*(1-t)*t * 164 + t*t * 232
                  py = (1-t)**2 * 267 + 2*(1-t)*t * 348 + t*t * 362
                  points.append((sc(px), sc(py)))
              for index in range(31):
                  t = index / 30
                  px = (1-t)**2 * 232 + 2*(1-t)*t * 318 + t*t * 326
                  py = (1-t)**2 * 362 + 2*(1-t)*t * 352 + t*t * 267
                  points.append((sc(px), sc(py)))
              md.polygon(points, fill=255)

              body = Image.new('RGBA', (W, H), (0, 0, 0, 0))
              bd = ImageDraw.Draw(body, 'RGBA')
              y0, y1 = sc(260), sc(365)
              for py in range(y0, y1):
                  fraction = (py - y0) / max(1, y1 - y0)
                  color = (int(212 - 65*fraction),
                           int(135 - 80*fraction),
                           int(20 - 12*fraction), 255)
                  bd.line([(0, py), (W, py)], fill=color)

              lighting = Image.new('RGBA', (W, H), (0, 0, 0, 0))
              ld = ImageDraw.Draw(lighting, 'RGBA')
              ld.ellipse((sc(150), sc(265), sc(270), sc(355)),
                         fill=(255, 225, 115, 115))
              ld.ellipse((sc(255), sc(275), sc(345), sc(365)),
                         fill=(65, 24, 0, 80))
              lighting = lighting.filter(ImageFilter.GaussianBlur(sc(13)))
              body = Image.alpha_composite(body, lighting)

              shine = Image.new('RGBA', (W, H), (0, 0, 0, 0))
              sd = ImageDraw.Draw(shine, 'RGBA')
              sd.rounded_rectangle((sc(200), sc(278), sc(225), sc(350)),
                                   radius=sc(10), fill=(255, 245, 174, 80))
              shine = shine.filter(ImageFilter.GaussianBlur(sc(10)))
              body = Image.alpha_composite(body, shine)
              body.putalpha(mask)
              base.alpha_composite(body)

              draw = ImageDraw.Draw(base, 'RGBA')
              draw.line(points + [points[0]], fill=(63, 31, 3, 255),
                        width=sc(4), joint='curve')

              outer = (sc(153), sc(235), sc(332), sc(295))
              inner = (sc(161), sc(242), sc(324), sc(286))
              draw.ellipse(outer, fill=(74, 37, 4, 255))
              draw.ellipse((outer[0] + sc(3), outer[1] + sc(3),
                            outer[2] - sc(3), outer[3] - sc(3)),
                           fill=(226, 149, 25, 255))

              opening = Image.new('RGBA', (W, H), (0, 0, 0, 0))
              od = ImageDraw.Draw(opening, 'RGBA')
              od.ellipse(inner, fill=(45, 22, 2, 255))
              od.ellipse((sc(176), sc(247), sc(301), sc(275)),
                         fill=(118, 67, 6, 210))
              opening = opening.filter(ImageFilter.GaussianBlur(sc(1.2)))
              base.alpha_composite(opening)

              draw = ImageDraw.Draw(base, 'RGBA')
              draw.ellipse(inner, outline=(35, 17, 2, 255), width=sc(3))
              draw.arc((sc(155), sc(237), sc(330), sc(293)),
                       start=185, end=355, fill=(255, 232, 128, 255), width=sc(5))
              draw.arc((sc(160), sc(241), sc(326), sc(289)),
                       start=5, end=175, fill=(102, 51, 4, 220), width=sc(3))

              rng = random.Random(seed)
              for _ in range(70):
                  px = rng.randint(sc(170), sc(318))
                  py = rng.randint(sc(270), sc(350))
                  if mask.getpixel((px, py)) > 0:
                      radius = rng.randint(sc(0.4), sc(1.1))
                      if rng.random() < 0.6:
                          color = (74, 34, 4, rng.randint(20, 55))
                      else:
                          color = (255, 221, 105, rng.randint(15, 40))
                      draw.ellipse((px-radius, py-radius, px+radius, py+radius), fill=color)

              rotated = base.rotate(angle, resample=Image.Resampling.BICUBIC,
                                    center=(sc(246), sc(284)), expand=False)
              shifted = Image.new('RGBA', (W, H), (0, 0, 0, 0))
              shifted.alpha_composite(rotated, (sc(dx), sc(dy)))
              return shifted.resize((CELL, CELL), Image.Resampling.LANCZOS)

          angles = [0, 1, -5, -12, -28, -58, -8, 14]
          x_offsets = [0, 0, 0, 1, 3, 5, 0, 5]
          y_offsets = [0, -2, -6, -20, -10, 0, -3, 12]

          output = Path('assets/art/game-scene/tools/brass/pour-sheet.png')
          output.parent.mkdir(parents=True, exist_ok=True)
          sheet = Image.new('RGBA', (CELL * 8, CELL), (0, 0, 0, 0))
          for index, values in enumerate(zip(angles, x_offsets, y_offsets)):
              frame = draw_ladle(*values)
              sheet.alpha_composite(frame, (index * CELL, 0))
          sheet.save(output, 'PNG', compress_level=9)

          check = Image.open(output)
          assert check.size == (4096, 512)
          assert check.mode == 'RGBA'
          assert check.getextrema()[3] == (0, 255)
          print(f'{output}: {check.size}, {check.mode}, {output.stat().st_size} bytes')
          PY
      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/game-scene/tools/brass/pour-sheet.png
          git commit -m "feat: add brass ladle pour sprite sheet"
          git pull --rebase origin main
          git push origin HEAD:main
