name: Fix quiz layer runtime

on:
  push:
    paths:
      - .github/workflows/fix-quiz-layer-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-quiz-layer-runtime
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove duplicate scene bootstraps and load runtime isolation last
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('콩쥐야_줘때써.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = '  <link rel="stylesheet" href="assets/css/redox-quiz.css?v=20260805-redox-mobile2">\n'
          css_line = '  <link rel="stylesheet" href="assets/css/layered-scene-runtime.css?v=20260806-runtime-fix1">\n'
          if css_line not in text:
              if css_anchor not in text:
                  raise SystemExit('Could not locate final quiz stylesheet anchor')
              text = text.replace(css_anchor, css_anchor + css_line, 1)

          text, inline_count = re.subn(
              r'\n  <script type="module">\n    import \{ mountGameScene \} from "\./assets/js/game-cosmetics-entry\.js\?v=20260806-layered-scene1";.*?\n  </script>\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              '  <script type="module" src="assets/js/quiz-scene-actors.js?v=20260805-fitted-seal1"></script>\n',
              '',
              1,
          )

          if inline_count != 1:
              raise SystemExit(f'Expected one inline scene bootstrap, removed {inline_count}')
          if text.count('game-cosmetics-entry.js?v=20260806-layered-scene1'):
              raise SystemExit('Duplicate inline layered-scene bootstrap remains')
          if 'quiz-scene-actors.js?v=20260805-fitted-seal1' in text:
              raise SystemExit('Legacy actor bootstrap remains in quiz HTML')
          if css_line not in text:
              raise SystemExit('Runtime isolation stylesheet was not added')

          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-quiz-layer-runtime.yml
          git add '콩쥐야_줘때써.html'
          git commit -m 'fix: restore single quiz scene runtime'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          exit 1
