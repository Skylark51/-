name: Apply Kongjwi sprite geometry fix
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-node-tests.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch canonical module graph and critical sprite guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path = Path("assets/js/main.js")
          main = main_path.read_text(encoding="utf-8")
          main, count = re.subn(
              r'from "\./metal-reactivity-choice-ui\.js\?v=[^"]+";',
              'from "./metal-reactivity-choice-ui.js";',
              main,
              count=1,
          )
          if count != 1:
              raise SystemExit("versioned metal-reactivity internal import not found")
          main_path.write_text(main, encoding="utf-8")

          page_path = Path("assets/js/game-page.js")
          page = page_path.read_text(encoding="utf-8")
          page, count = re.subn(
              r'from "\./main\.js\?v=[^"]+";',
              'from "./main.js";',
              page,
              count=1,
          )
          if count != 1:
              raise SystemExit("versioned main internal import not found")

          guard = '''\nconst KONGJWI_SPRITE_GUARD_ID = "kongjwi-sprite-sheet-geometry-guard";\n\nfunction installKongjwiSpriteGeometryGuard() {\n  if (document.getElementById(KONGJWI_SPRITE_GUARD_ID)) return;\n  const style = document.createElement("style");\n  style.id = KONGJWI_SPRITE_GUARD_ID;\n  style.textContent = `\n    #ui-gameApp .scene-kongjwi[data-sprite-mode="sheet"] > .scene-sprite {\n      background-size: calc(var(--scene-frame-count) * 100%) 100% !important;\n      background-position-y: center !important;\n    }\n  `;\n  document.head.append(style);\n}\n'''
          import_anchor = 'import { mountOpeningCountdown } from "./opening-countdown-flow.js";\n'
          if "installKongjwiSpriteGeometryGuard" not in page:
              if import_anchor not in page:
                  raise SystemExit("game-page import anchor not found")
              page = page.replace(import_anchor, import_anchor + guard, 1)

          call_anchor = "const api = bootstrapGameRuntime();\n"
          if "installKongjwiSpriteGeometryGuard();" not in page:
              if call_anchor not in page:
                  raise SystemExit("bootstrap call anchor not found")
              page = page.replace(call_anchor, call_anchor + "installKongjwiSpriteGeometryGuard();\n", 1)
          page_path.write_text(page, encoding="utf-8")

          html_path = Path("콩쥐야_줘때써.html")
          html = html_path.read_text(encoding="utf-8")
          html, count = re.subn(
              r'assets/js/game-page\.js\?v=[^"\']+',
              'assets/js/game-page.js?v=20260808-sprite-sheet2',
              html,
              count=1,
          )
          if count != 1:
              raise SystemExit("game-page outer cache boundary not found")
          html_path.write_text(html, encoding="utf-8")

          test_path = Path("tests/kongjwi-sprite-sheet-sizing.test.mjs")
          test_path.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst choiceUi = fs.readFileSync("assets/js/metal-reactivity-choice-ui.js", "utf8");\nconst spriteCss = fs.readFileSync("assets/css/game-asset-animation.css", "utf8");\nconst main = fs.readFileSync("assets/js/main.js", "utf8");\nconst gamePage = fs.readFileSync("assets/js/game-page.js", "utf8");\nconst html = fs.readFileSync("콩쥐야_줘때써.html", "utf8");\n\ntest("Kongjwi horizontal sprite sheets always map one complete frame into the actor box", () => {\n  assert.ok(!choiceUi.includes("background-size: calc(var(--scene-frame-count) * 100%) auto"), "auto sprite-sheet height crops the top of Kongjwi frames");\n  assert.ok(spriteCss.includes("background-size: calc(var(--scene-frame-count) * 100%) 100%"), "base sprite runtime must map one full horizontal cell into the actor box");\n  assert.ok(gamePage.includes('KONGJWI_SPRITE_GUARD_ID = "kongjwi-sprite-sheet-geometry-guard"'));\n  assert.ok(gamePage.includes("background-size: calc(var(--scene-frame-count) * 100%) 100% !important"));\n  assert.ok(gamePage.indexOf("installKongjwiSpriteGeometryGuard();") > gamePage.indexOf("bootstrapGameRuntime();"), "critical guard must be installed after any stale runtime style injection");\n});\n\ntest("sprite repair keeps one outer cache boundary and canonical internal module identities", () => {\n  assert.ok(main.includes('from "./metal-reactivity-choice-ui.js";'));\n  assert.ok(!main.includes("metal-reactivity-choice-ui.js?v="));\n  assert.ok(gamePage.includes('from "./main.js";'));\n  assert.ok(!gamePage.includes("main.js?v="));\n  assert.ok(html.includes('assets/js/game-page.js?v=20260808-sprite-sheet2'));\n});\n''', encoding="utf-8")
          PY
      - name: Run full fast regression gate
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
          node scripts/validate-questions.mjs
          node --test tests/*.mjs
          node scripts/test-metal-reactivity-route.mjs
          node scripts/validate-layered-scene.mjs
          git diff --check
      - name: Commit verified fix and remove diagnostic workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diag-node-tests.yml
          git add assets/js/main.js assets/js/game-page.js "콩쥐야_줘때써.html" tests/kongjwi-sprite-sheet-sizing.test.mjs
          git commit -m "fix: keep full Kongjwi frame visible on mobile"
          git pull --rebase origin main
          git push