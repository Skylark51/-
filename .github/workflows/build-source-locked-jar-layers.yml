name: Build source-locked gameplay jars

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-source-locked-jar-layers.py"
      - "assets/art/jars/**"
      - "tests/jar-source-frame-regression.test.mjs"
      - ".github/workflows/build-source-locked-jar-layers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image build dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Rebuild source-locked jar layers
        run: python scripts/build-source-locked-jar-layers.py

      - name: Validate generated PNG layers
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/jar-source-frame-regression.test.mjs
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          skins = ("onggi", "celadon", "moon-white", "night-lacquer")
          for skin in skins:
              root = Path("assets/art/game-scene/jars") / skin
              expected = {
                  "open-no-toad.png": (1024, 1024),
                  "hole-front.png": (1024, 1024),
                  "layers.png": (2048, 1024),
              }
              for name, size in expected.items():
                  image = Image.open(root / name)
                  assert image.format == "PNG", (skin, name, image.format)
                  assert image.mode == "RGBA", (skin, name, image.mode)
                  assert image.size == size, (skin, name, image.size)
          PY
          git diff --check

      - name: Commit generated gameplay jar assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/game-scene/manifest.json assets/art/game-scene/jars
          if git diff --cached --quiet; then
            echo "No generated jar changes."
            exit 0
          fi
          git commit -m "feat: rebuild gameplay jars from source PNGs [skip ci]"
          git push
