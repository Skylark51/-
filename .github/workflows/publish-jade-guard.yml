name: Publish jade guard toad asset

on:
  push:
    paths:
      - ".github/workflows/publish-jade-guard.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify original PNG
        run: |
          set -euo pipefail
          mkdir -p assets/art/game-scene/toad/skins
          curl --fail --location --retry 3 \
            'https://oaisdmntprsouthcentralus.blob.core.windows.net/files/00000000-7eec-81f7-8252-af1d280d0501/raw?se=2026-08-06T02%3A17%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=019fd4ae-bfa5-788d-9864-5d2a9e7cd9f8&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T22%3A39%3A05Z&ske=2026-08-06T22%3A39%3A05Z&sks=b&skv=2026-02-06&sig=fGKrWkQgSXFleEPLybC8YksIyYU2atC0R6OoApFQOq0%3D' \
            --output assets/art/game-scene/toad/skins/jade-guard.png
          file assets/art/game-scene/toad/skins/jade-guard.png
          echo '9c59c52ceba078fd6bb248d2f264bc795eb4a73a8310bc3a2dd70b160cf57254  assets/art/game-scene/toad/skins/jade-guard.png' | sha256sum --check --strict
          python -m pip install --disable-pip-version-check 'Pillow==12.2.0'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path('assets/art/game-scene/toad/skins/jade-guard.png')
          with Image.open(path) as image:
              assert image.format == 'PNG', image.format
              assert image.size == (1024, 768), image.size
              assert image.mode == 'RGBA', image.mode
              assert image.getextrema()[3] == (0, 255), image.getextrema()[3]
          assert path.stat().st_size == 1208719, path.stat().st_size
          print(f'{path}: 1024x768 RGBA, {path.stat().st_size} bytes')
          PY

      - name: Commit and push final asset
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-jade-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/art/game-scene/toad/skins/jade-guard.png .github/workflows/publish-jade-guard.yml
          git commit -m 'feat: add jade guard toad skin'
          git push origin HEAD:main
