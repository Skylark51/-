name: Apply lobby entry cache refresh

on:
  push:
    paths:
      - .github/workflows/fix-lobby-entry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh lobby entry versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ('data-ui-version="20260805-home-square4"', 'data-ui-version="20260806-lobby-router1"'),
              ('assets/css/lobby-hero-scene.css?v=20260805-home-square4', 'assets/css/lobby-hero-scene.css?v=20260806-lobby-router1'),
              ('assets/js/lobby-actions.js?v=20260804-home-clean3', 'assets/js/lobby-actions.js?v=20260806-lobby-router1'),
              ('assets/js/lobby-navigation.js?v=20260805-home-square4', 'assets/js/lobby-navigation.js?v=20260806-lobby-router1'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing replacement anchor: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit refreshed entry
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-lobby-entry.yml
          git add index.html
          git commit -m 'fix: refresh lobby router assets'
          git push origin HEAD:main
