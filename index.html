<!doctype html>
<html lang="ko" data-page="lobby">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a31">
  <link rel="icon" href="data:,">
  <meta name="description" content="콩쥐와 두꺼비가 함께하는 고등학교 화학 훈련 게임">
  <title>콩쥐야 줘때써 - 화학편</title>
  <link rel="stylesheet" href="assets/css/game.css?v=20260728-01">
</head>
<body class="lobby-page">
  <a class="skip-link" href="#trainingGrid">훈련 목록으로 바로가기</a>
  <main class="lobby-shell">
    <header class="lobby-hero">
      <div class="brand-mark" aria-hidden="true">豆</div>
      <div>
        <p class="eyebrow">KOREAN FOLKTALE CHEMISTRY TRAINING</p>
        <h1>콩쥐야 줘때써 - 화학편</h1>
        <p>새는 장독대를 지키며 원하는 화학 훈련을 골라 집중 연습하세요.</p>
      </div>
      <button id="settingsButton" class="ghost-button" type="button">설정</button>
    </header>

    <section id="resumePanel" class="resume-panel" hidden aria-labelledby="resumeTitle">
      <div><p class="eyebrow">CONTINUE TRAINING</p><h2 id="resumeTitle">지난 훈련 이어하기</h2><p id="resumeSummary"></p></div>
      <div class="resume-actions"><button id="resumeButton" class="primary-button" type="button">이어하기</button><button id="freshButton" class="ghost-button" type="button">처음부터</button></div>
    </section>

    <section class="lobby-section">
      <div class="section-heading"><div><p class="eyebrow">CHOOSE YOUR LESSON</p><h2>오늘의 훈련</h2></div><p>카테고리를 고르고 한 가지 훈련에 집중해 보세요.</p></div>
      <div class="category-filter" id="categoryFilter" role="group" aria-label="훈련 카테고리"></div>
      <label class="mobile-category" for="categorySelect">카테고리<select id="categorySelect"></select></label>
      <div class="training-grid" id="trainingGrid" aria-live="polite"></div>
    </section>

    <section class="records-section" aria-labelledby="recordsTitle">
      <div class="section-heading"><div><p class="eyebrow">MY RECORDS</p><h2 id="recordsTitle">개인 기록</h2></div><p>훈련별 기록은 서로 합산하지 않습니다.</p></div>
      <div class="record-grid" id="recordGrid"></div>
    </section>
  </main>

  <dialog id="difficultyDialog" class="modal-card" aria-labelledby="difficultyTitle">
    <form method="dialog">
      <button class="modal-close" value="cancel" aria-label="닫기">×</button>
      <p class="eyebrow">SELECT DIFFICULTY</p>
      <h2 id="difficultyTitle">난도 선택</h2>
      <p id="difficultyDescription"></p>
      <div class="difficulty-grid">
        <button type="button" data-difficulty="easy"><strong>쉬움</strong><span>넉넉한 시간 · 느린 누수</span></button>
        <button type="button" data-difficulty="normal"><strong>보통</strong><span>균형 잡힌 기본 훈련</span></button>
        <button type="button" data-difficulty="hard"><strong>어려움</strong><span>짧은 시간 · 높은 난도</span></button>
      </div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="modal-card" aria-labelledby="settingsTitle">
    <form method="dialog">
      <button class="modal-close" value="cancel" aria-label="닫기">×</button>
      <p class="eyebrow">SETTINGS</p><h2 id="settingsTitle">설정</h2>
      <label>음량 <input id="volumeSetting" type="range" min="0" max="1" step="0.1"></label>
      <label class="toggle-row"><input id="motionSetting" type="checkbox"> 애니메이션 사용</label>
      <button class="primary-button" value="save">저장</button>
    </form>
  </dialog>

  <script type="module" src="assets/js/ui-effects.js?v=20260728-01"></script>
</body>
</html>
